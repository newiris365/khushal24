name: IRIS 365 Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Verify Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Frontend TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: Check Server TypeScript
        run: npx tsc --noEmit -p tsconfig.server.json

      - name: Run ESLint
        run: npm run lint

      - name: Run Jest Unit Tests
        run: npm test -- --passWithNoTests
